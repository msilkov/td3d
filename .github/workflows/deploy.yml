name: Deploy

# Только вручную. Пуш в main прод не выкатывает: решение о выкате принимает
# человек, а не слияние PR. Автодеплой Vercel выключен в vercel.json, эта
# кнопка — единственный путь на прод.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Сборка без секретов: npm ci, линтер, тесты и vite build исполняют код
  # зависимостей, и прод-токен этому коду недоступен в принципе.
  build:
    runs-on: ubuntu-latest

    steps:
      # Прод собирается только из main. Запуск с другой ветки — почти всегда
      # промах в выпадающем списке, и лучше упасть, чем выкатить не то.
      - name: Проверить ветку
        if: github.ref_name != 'main'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::прод собирается только из main, а запуск пришёл с $REF_NAME"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Линтер и тесты
        run: |
          npm run lint
          npm test

      # Статика в формате Build Output API — его и ждёт vercel deploy --prebuilt.
      # Каталог не скрытый: upload-artifact пропускает пути с точкой.
      - name: Собрать
        run: |
          npm run build
          mkdir -p vercel-output
          cp -r dist vercel-output/static
          echo '{"version":3}' > vercel-output/config.json

      - uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: vercel-output
          retention-days: 1

  # Выкат с токеном: здесь нет ни исходников, ни node_modules — только готовая
  # статика и CLI Vercel закреплённой версии.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Секреты лежат в окружении Production: без строки ниже
    # ${{ secrets.VERCEL_TOKEN }} молча развернётся в пустую строку.
    environment: Production

    env:
      # Не секреты, а идентификаторы проекта: те же, что в .vercel/project.json.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # С прод-токеном исполняется ровно проверенный код, а не то, что окажется
      # в npm под latest в момент запуска.
      VERCEL_CLI: 60.1.3

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output

      - name: Выкатить
        run: npx --yes vercel@$VERCEL_CLI deploy --prebuilt --prod --token="$VERCEL_TOKEN"
